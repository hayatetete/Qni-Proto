services:
  qni-notebook-demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      VITE_USE_GPU: "${VITE_USE_GPU:-false}"
      QNI_FRONTEND_PORT: "${QNI_DEMO_FRONTEND_PORT:-5173}"
      QNI_BACKEND_PORT: "${QNI_DEMO_BACKEND_PORT:-8000}"
      QNI_JUPYTER_PORT: "${QNI_DEMO_JUPYTER_PORT:-8888}"
      QNI_PUBLIC_HOST: "${QNI_DEMO_PUBLIC_HOST:-127.0.0.1}"
    ports:
      - "127.0.0.1:${QNI_DEMO_FRONTEND_PORT:-5173}:${QNI_DEMO_FRONTEND_PORT:-5173}"
      - "127.0.0.1:${QNI_DEMO_BACKEND_PORT:-8000}:${QNI_DEMO_BACKEND_PORT:-8000}"
      - "127.0.0.1:${QNI_DEMO_JUPYTER_PORT:-8888}:8888"
