[project]
name = "qni-jupyter"
version = "0.1.0"
description = "Jupyter Notebook helper for opening QniGPU."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ipython>=8.0",
  "quri-parts>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qni_jupyter"]
